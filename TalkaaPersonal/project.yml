name: TalkaaPersonal
options:
  bundleIdPrefix: com.personal.talkaa
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  TalkaaPersonal:
    type: application
    platform: iOS
    sources:
      - path: TalkaaPersonal
      - path: TalkaaLiveActivityWidget/TalkaaLiveActivityAttributes.swift
    info:
      path: TalkaaPersonal/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.talkaa.app
        INFOPLIST_FILE: TalkaaPersonal/Resources/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_LIVE_ACTIVITIES: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: TalkaaLiveActivityWidget

  TalkaaLiveActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TalkaaLiveActivityWidget
    info:
      path: TalkaaLiveActivityWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.talkaa.app.LiveActivityWidget
        INFOPLIST_FILE: TalkaaLiveActivityWidget/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
